services:
  audiobooks:
    image: starf0x/my-audiobook-collection:latest
    container_name: my-audiobook-collection
    ports:
      - "8523:8523"
    # Cloudflare's resolver, so the metadata lookup works whatever the host's DNS
    # is doing. Add your router's address as a second entry if you need local
    # names inside the container.
    dns:
      - 1.1.1.1
    environment:
      # who the app writes as: without these it runs as root, and the folders it
      # creates on your share are ones you cannot write into yourself
      PUID: "99"
      PGID: "100"
      UMASK: "000"
      # both of these may be left empty
      ADMIN_PASSWORD: ""
      GOOGLE_API_KEY: ""
      # which country's Google catalogue to answer from; series data belongs to one
      GOOGLE_COUNTRY: "US"
      # Home Assistant: a token to require on /api/ha*, and the address other
      # machines reach this app on when that is not the one they asked at
      HA_TOKEN: ""
      BASE_URL: ""
    volumes:
      - ./data:/data
      - /mnt/user/Audiobooks:/audiobooks
      - /mnt/user/Audiobooks/_AutoDownload:/import
    restart: unless-stopped

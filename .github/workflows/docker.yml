name: Publish Docker image

# Tags only, deliberately. A tag on main used to fire this twice — once for the
# branch, once for the tag — and both runs pushed :latest. The two images were
# built from one commit but were not byte-for-byte equal, so whichever finished
# last won the tag: on v2.5.64 that was the tag run by three seconds. Every
# shipped change is tagged here anyway, so one run per release settles it and
# :latest is always the same digest as its vX.Y.Z.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/my-audiobook-collection
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # keeps the Docker Hub page the same text as the README; on the release
      # itself, since that is the only run there is now
      - uses: peter-evans/dockerhub-description@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/my-audiobook-collection
          short-description: Browse and play an audiobook collection organised as Genre / Author / Series / Book
